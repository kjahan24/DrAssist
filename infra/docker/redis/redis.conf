# Baseline Redis configuration for local/dev use via docker-compose.
# The container is started with `--requirepass ${REDIS_PASSWORD}`
# (see docker-compose.yml); tune persistence/memory policy below for
# staging and production.

appendonly yes
appendfsync everysec

maxmemory 256mb
maxmemory-policy allkeys-lru

# Celery result backend + cache share this instance in dev via separate
# logical DBs (see REDIS_DB / CELERY_* URLs in .env.example). Split into
# dedicated Redis instances per concern before scaling to production load.
databases 16
