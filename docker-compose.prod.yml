# Production overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Do NOT combine with docker-compose.override.yml in production.

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: drassist-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - drassist-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["gunicorn", "app.main:app", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--workers", "${BACKEND_WORKERS:-4}"]
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  celery-worker:
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  celery-beat:
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  postgres:
    restart: always

  redis:
    restart: always

  qdrant:
    restart: always

  minio:
    restart: always
