# Automatically merged with docker-compose.yml by `docker compose up` for local
# development. Provides hot-reload, source mounts, and dev-only tooling ports.
# This file is git-tracked as the default dev experience; do not put secrets here.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
      - ./backend/logs:/app/logs
    environment:
      BACKEND_RELOAD: "true"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/app:/app/app

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
